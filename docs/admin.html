<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin – Studio Black</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="admin.css" />
</head>

<body>

    <!-- ===== TELA DE LOGIN ===== -->
    <div id="tela-login">
        <div class="login-box">

            <div class="login-logo">
                <span class="l-studio">STUDIO</span>
                <span class="l-black">BLACK</span>
                <span class="l-badge">ADMIN</span>
            </div>

            <h1 class="login-titulo">Área Administrativa</h1>
            <p class="login-sub">Selecione seu perfil e insira a senha de acesso</p>

            <div class="barber-tabs">
                <button class="barber-tab active" data-b="Borel Barber" onclick="selecionarBarbeiro(this)">
                    <div class="tab-avatar">B</div>
                    <span>Borel Barber</span>
                </button>
                <button class="barber-tab" data-b="Junior Barber" onclick="selecionarBarbeiro(this)">
                    <div class="tab-avatar">J</div>
                    <span>Junior Barber</span>
                </button>
            </div>

            <div class="login-campo">
                <label>Senha</label>
                <div class="input-wrap">
                    <input type="password" id="input-senha" placeholder="••••••••"
                        onkeydown="if(event.key==='Enter') fazerLogin()" />
                    <button class="toggle-senha" onclick="toggleSenha()" title="Mostrar senha">
                        <svg id="icon-eye" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                            <circle cx="12" cy="12" r="3" />
                        </svg>
                    </button>
                </div>
            </div>

            <div id="login-erro" class="login-erro"></div>

            <button class="btn-entrar" onclick="fazerLogin()">Entrar no Painel</button>

            <a href="index.html" class="login-voltar">← Voltar ao site</a>
        </div>
    </div>

    <!-- ===== PAINEL ADMIN ===== -->
    <div id="tela-painel" style="display:none">

        <!-- Topbar -->
        <header class="topbar">
            <div class="topbar-logo">
                <span class="l-studio">STUDIO</span>
                <span class="l-black">BLACK</span>
            </div>
            <div class="topbar-center">
                <span class="topbar-barbeiro" id="topbar-nome"></span>
                <span class="topbar-dot">●</span>
                <span class="topbar-status">Online</span>
            </div>
            <div class="topbar-actions">
                <button class="btn-atualizar" onclick="atualizarPainel()" title="Atualizar dados">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="23 4 23 10 17 10" />
                        <polyline points="1 20 1 14 7 14" />
                        <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15" />
                    </svg>
                    Atualizar
                </button>
                <button class="btn-sair" onclick="fazerLogout()">Sair</button>
            </div>
        </header>

        <main class="painel-body">

            <!-- KPIs -->
            <section class="kpis-section">
                <div class="kpi-card gold-border">
                    <div class="kpi-icon">💰</div>
                    <div class="kpi-info">
                        <span class="kpi-label">Faturamento Hoje</span>
                        <span class="kpi-valor gold" id="kpi-fat">R$ 0</span>
                    </div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-icon">👥</div>
                    <div class="kpi-info">
                        <span class="kpi-label">Clientes Hoje</span>
                        <span class="kpi-valor" id="kpi-cli">0</span>
                    </div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-icon">⏰</div>
                    <div class="kpi-info">
                        <span class="kpi-label">Próximo Cliente</span>
                        <span class="kpi-valor sm" id="kpi-prox">—</span>
                    </div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-icon">🕐</div>
                    <div class="kpi-info">
                        <span class="kpi-label">Horários Livres</span>
                        <span class="kpi-valor" id="kpi-livre">—</span>
                    </div>
                </div>
            </section>

            <!-- Agenda hoje -->
            <section class="painel-section">
                <div class="section-header">
                    <div class="section-header-left">
                        <h2>📅 Agenda de Hoje</h2>
                        <span id="label-data-hoje" class="label-data"></span>
                    </div>
                </div>
                <div id="load-hoje" class="carregando">
                    <div class="spin"></div> Carregando agenda…
                </div>
                <div id="lista-hoje" class="agenda-lista"></div>
            </section>

            <!-- Histórico -->
            <section class="painel-section">
                <div class="section-header">
                    <div class="section-header-left">
                        <h2>📊 Histórico</h2>
                    </div>
                    <div class="filtro-wrap">
                        <input type="date" id="filtro-data" onchange="filtrarHistorico()" />
                        <button class="btn-limpar" onclick="limparFiltro()">Limpar</button>
                    </div>
                </div>
                <div id="load-hist" class="carregando" style="display:none">
                    <div class="spin"></div> Carregando…
                </div>
                <div id="lista-hist" class="agenda-lista"></div>
                <div id="resumo-hist" class="resumo-hist"></div>
            </section>

        </main>
    </div>

    <script src="admin.js"></script>
</body>

</html>
